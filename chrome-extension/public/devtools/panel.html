<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AIOS Network Panel</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; }
      header { display:flex; align-items:center; gap:8px; padding:8px; border-bottom: 1px solid #e5e7eb; }
      input[type="text"] { flex:1; padding:6px 8px; border:1px solid #d1d5db; border-radius:4px; }
      button { padding:6px 10px; border:1px solid #d1d5db; background:#fff; border-radius:4px; cursor:pointer; }
      table { width:100%; border-collapse: collapse; }
      th, td { padding:6px 8px; border-bottom: 1px solid #f3f4f6; text-align:left; font-size:12px; }
      th { background:#f9fafb; position: sticky; top: 0; z-index: 1; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </head>
  <body>
    <header>
      <input id="filter" type="text" placeholder="Filter URL or method..." />
      <button id="clear">Clear</button>
    </header>
    <table>
      <thead>
        <tr>
          <th>Method</th>
          <th>URL</th>
          <th>Status</th>
          <th>Type</th>
          <th class="mono">Time (ms)</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <script src="./panel.js"></script>
  </body>
  </html>
